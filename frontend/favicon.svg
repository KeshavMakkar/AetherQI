<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="aetherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="airStream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Modern App Icon Rounded Badge -->
  <rect width="64" height="64" rx="16" fill="url(#aetherGrad)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- AetherQI Wind & Air Currents -->
  <g filter="url(#shadow)">
    <!-- Top Wind Loop -->
    <path d="M14 23h24a5.5 5.5 0 1 0-4.2-9" fill="none" stroke="url(#airStream)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Middle Main Wind Streamline with AI Intelligence Node -->
    <path d="M12 32h33a6 6 0 1 1-5 9.5" fill="none" stroke="url(#airStream)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="45" cy="32" r="3" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5" />
    
    <!-- Bottom Wind Loop -->
    <path d="M16 43h17a5 5 0 1 0-3.8-8.2" fill="none" stroke="url(#airStream)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
